name: Build installers

# main: reserve one patch version/commit, build all targets, then publish once.
# PR/manual: validate and build only; no signing credentials or release permissions.
# Release tags are created by prepare with GITHUB_TOKEN (no recursive tag workflow).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an in-flight release. GitHub retains only the newest pending run;
# prepare snapshots latest main so closely spaced merges can share one release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'release-main' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Validate release automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run test:release

  prepare:
    name: Reserve release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.reserve.outputs.version }}
      tag: ${{ steps.reserve.outputs.tag }}
      sha: ${{ steps.reserve.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate signing configuration before reserving a version
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '::error::Configure TAURI_SIGNING_PRIVATE_KEY before publishing updater artifacts.'
            exit 1
          fi
      - name: Reserve immutable version and source commit
        id: reserve
        run: node scripts/prepare-release.mjs

  build:
    name: Build (${{ matrix.name }})
    needs: [validate, prepare]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos
            name: macOS (universal)
            platform: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - id: linux
            name: Linux (x86_64)
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ""
          - id: windows
            name: Windows (x86_64)
            platform: windows-latest
            args: --bundles nsis,msi
            rust-targets: ""
    steps:
      - name: Checkout identical reserved commit on every release platform
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Install Linux system dependencies
        if: matrix.id == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Build and package without writing a GitHub Release
        id: package
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.prepare.result == 'success' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ needs.prepare.result == 'success' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          args: ${{ matrix.args }}${{ needs.prepare.result == 'success' && ' --config src-tauri/tauri.updater.conf.json' || '' }}
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: ${{ needs.prepare.result != 'success' }}
          workflowArtifactNamePattern: "Pion_[platform]_[arch]_[bundle]_[version]"
      - name: Record and verify release build identity
        if: needs.prepare.result == 'success'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          BUILT_VERSION: ${{ steps.package.outputs.appVersion }}
          RELEASE_PLATFORM: ${{ matrix.id }}
        run: |
          node scripts/publish-release.mjs record --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" \
            --platform "$RELEASE_PLATFORM" --app-version "$BUILT_VERSION" \
            --output "src-tauri/target/release-$RELEASE_PLATFORM.json"
      - name: Upload signed release bundles and build identity
        if: needs.prepare.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Pion-release-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release-${{ matrix.id }}.json
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.app.tar.gz
            src-tauri/target/**/bundle/**/*.sig

  publish:
    name: Publish complete signed release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: Pion-release-*
          path: release-artifacts
      - name: Validate all platforms, upload draft assets, then publish one latest.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          node scripts/publish-release.mjs publish --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" \
            --artifacts release-artifacts --output release-publish
