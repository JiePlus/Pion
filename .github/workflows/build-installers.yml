name: Build installers

# Builds and packages Pion installers, restricted to the main branch:
# - on pushes to main: build, upload the bundles as workflow artifacts and create/update a
#   published GitHub Release (tag v<version>) with the installers attached
# - on pull requests targeting main and manual runs: build only, upload workflow artifacts
# - on a version tag (e.g. v0.1.0): build and attach the bundles to a GitHub Release
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    permissions:
      # Needed to create/update the release on main pushes and version tags.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            # Universal binary so the same DMG runs on Apple Silicon and Intel.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (x86_64)
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ""
          - name: Windows (x86_64)
            platform: windows-latest
            args: --bundles nsis,msi
            rust-targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and package
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Publish a release (tagged v<version>) on main pushes and version tags; PR/manual only build.
          tagName: ${{ (github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'v__VERSION__' || '' }}
          releaseName: ${{ (github.ref_type == 'tag' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'Pion v__VERSION__' || '' }}
          releaseBody: "Download the installer for your platform from the assets below."
          releaseDraft: false
          prerelease: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "Pion_[platform]_[arch]_[bundle]_[version]"
