name: Build installers

# Builds platform installers for Pion:
# - on every pull request / manual run: build only, upload the bundles as workflow artifacts
# - on a version tag (e.g. v0.1.0): build, attach the bundles to a draft GitHub Release and
#   produce the signed updater artifacts plus latest.json used by in-app updates
on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    permissions:
      # Needed to create/update the draft release when running on a tag.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            # Universal binary so the same DMG runs on Apple Silicon and Intel.
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux (x86_64)
            platform: ubuntu-22.04
            args: --bundles deb,appimage
            rust-targets: ""
          - name: Windows (x86_64)
            platform: windows-latest
            args: --bundles nsis,msi
            rust-targets: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and package
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required to sign updater artifacts. Pull-request builds skip updater artifacts,
          # so these can be empty there; tag releases need the values set as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # On a tag, enable updater artifacts so tauri-action also uploads latest.json.
          args: ${{ matrix.args }}${{ github.ref_type == 'tag' && ' --config src-tauri/tauri.updater.conf.json' || '' }}
          # Release creation is only enabled when the workflow runs for a tag.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Pion {0}', github.ref_name) || '' }}
          releaseBody: "Download the installer for your platform from the assets below. Pion checks these releases for in-app updates."
          releaseDraft: true
          prerelease: false
          # Uploads the signed updater artifacts and the static latest.json used by the app.
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "Pion_[platform]_[arch]_[bundle]_[version]"
