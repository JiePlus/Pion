<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pion · 模型服务设计图总览</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 1500px;
        margin: 0 auto;
        padding: 40px;
        background: #f1f5f9;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 32px;
        color: #64748b;
        font-size: 14px;
      }
      .section {
        margin-bottom: 34px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 16px;
      }
      .pair {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      a {
        display: block;
        overflow: hidden;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: white;
        color: inherit;
        text-decoration: none;
      }
      img {
        display: block;
        width: 100%;
      }
      span {
        display: block;
        padding: 9px 12px;
        font-size: 12px;
      }
      @media (max-width: 800px) {
        body {
          padding: 20px;
        }
        .pair {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Pion · 模型服务</h1>
    <p>
      10 个关键页面状态 × 浅色与深色主题。点击缩略图可查看 2880 × 1800
      PNG；设计画板可用方向键切换页面。
    </p>
    <div id="gallery"></div>
    <script>
      const screens = [
        ["01-api-key", "API Key 与已保存凭据"],
        ["02-pi-login", "Pi 登录"],
        ["03-login-flow", "Pi 登录授权"],
        ["04-environment", "环境变量"],
        ["05-custom-endpoint", "自定义服务商与模型"],
        ["06-add-provider", "新增服务商"],
        ["07-model-discovery", "获取模型列表"],
        ["08-model-details", "编辑模型"],
        ["09-custom-empty", "自定义接口空状态"],
        ["10-provider-extension", "服务商扩展"],
      ];
      document.getElementById("gallery").innerHTML = screens
        .map(
          ([id, title]) =>
            `<section class="section"><h2>${title}</h2><div class="pair"><a href="screens/${id}-light.png"><img src="screens/${id}-light.png" alt="${title}，浅色主题" /><span>浅色主题</span></a><a href="screens/${id}-dark.png"><img src="screens/${id}-dark.png" alt="${title}，深色主题" /><span>深色主题</span></a></div></section>`,
        )
        .join("");
    </script>
  </body>
</html>
